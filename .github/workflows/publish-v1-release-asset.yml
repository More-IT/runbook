name: Publish v1.0.0 release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and attach signed package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signed source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build release package
        run: php build/create-package.php --out="${{ runner.temp }}/runbook-release"

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0.0 "${{ runner.temp }}/runbook-release/runbook-1.0.0.tar.gz" --repo "${{ github.repository }}" --clobber
